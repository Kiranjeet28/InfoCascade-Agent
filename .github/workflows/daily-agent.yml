name: InfoCascade Notice Sync

on:
  schedule:
    # Every day at 4:00 PM IST (10:30 UTC)
    - cron: "30 10 * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Notice Sync API

        run: |
          curl -X POST \
          "${{ secrets.API_URL }}/api/notices/sync" \
          -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
          -H "Content-Type: application/json"